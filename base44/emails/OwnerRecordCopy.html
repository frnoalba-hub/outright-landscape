<mjml>
  <mj-head>
    <mj-title>{{heading}} | Outright Landscape</mj-title>
    <mj-preview>{{notice}}</mj-preview>
    <mj-attributes>
      <mj-all font-family="Arial, Helvetica, sans-serif" />
      <mj-section background-color="#ffffff" padding="0 32px" />
      <mj-column padding="0" />
      <mj-text color="#0a0a0a" font-size="15px" line-height="1.6" padding="0" />
      <mj-class name="muted" color="#737373" />
    </mj-attributes>
  </mj-head>
  <mj-body background-color="#ffffff" width="600px">
    <mj-section background-color="#c45d2c" padding="22px 32px" border-radius="8px 8px 0 0"><mj-column>
      <mj-image src="https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/688d77e918e168a3b8c3aaa2/67da3ccf9_OutrightLandscapeConstructionEmblem1.png" alt="Outright Landscape" width="42px" padding="0 0 10px" />
      <mj-text align="center" color="#000000" font-weight="700">Outright Landscape</mj-text>
    </mj-column></mj-section>
    <mj-section padding="32px 32px 20px"><mj-column>
      <mj-text font-size="25px" line-height="1.25" font-weight="700" padding="0 0 10px">{{heading}}</mj-text>
      <mj-text mj-class="muted">{{notice}}</mj-text>
    </mj-column></mj-section>
    <mj-section padding="0 32px 28px"><mj-column border-left="3px solid #c45d2c" padding="0 0 0 14px">
      <mj-text padding="0 0 14px"><strong>Copy sent:</strong> {{sentAt}}</mj-text>
      <mj-text><div style="white-space: pre-wrap; overflow-wrap: anywhere">{{details}}</div></mj-text>
    </mj-column></mj-section>
    <mj-section padding="16px 32px" border-top="1px solid #e5e5e5"><mj-column>
      <mj-text mj-class="muted" font-size="13px">Private copy for Outright Landscape.</mj-text>
    </mj-column></mj-section>
  </mj-body>
</mjml>
